<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultrasonic — Navidrome Music</title>
  <style>
    :root {
      --bg-canvas: #101012;
      --bg-sidebar: #161619;
      --bg-elevated: #1d1d21;
      --bg-input: #18181c;
      --bg-transport: #17171a;
      --border: #26262b;
      --accent: #fa2d48;
      --accent-hover: #ff455d;
      --green: #30d158;
      --text-primary: #f5f5f7;
      --text-secondary: #98989f;
      --text-muted: #636369;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #wasm-container { display: none; width: 100vw; height: 100vh; }
    canvas#canvas { width: 100%; height: 100%; display: block; }

    /* Centered Startup Login Screen */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-panel {
      width: 400px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .login-header { display: flex; align-items: center; gap: 14px; }
    .emblem {
      width: 44px; height: 44px; border-radius: 10px; background: var(--accent);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
    .text-input {
      height: 36px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 6px; padding: 0 12px; color: var(--text-primary); font-size: 13px; outline: none;
    }
    .text-input:focus { border-color: var(--accent); }
    .btn-primary {
      height: 38px; background: var(--accent); border: none; border-radius: 7px;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Main Workspace */
    .workspace { display: none; flex: 1; overflow: hidden; }
    aside {
      width: 240px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; height: 28px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; }
    .sec-title { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; padding: 0 6px; margin-bottom: 4px; }
    .nav-btn, .lib-row {
      display: flex; align-items: center; gap: 10px;
      height: 32px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: var(--text-primary);
      cursor: pointer; user-select: none; border: none; background: transparent; width: 100%; text-align: left;
    }
    .nav-btn:hover, .lib-row:hover { background: #222227; }
    .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
    .chk {
      width: 15px; height: 15px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-elevated);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .chk.on { background: var(--accent); border-color: var(--accent); }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header {
      height: 48px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    }
    .pill {
      height: 28px; display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary);
      padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .content { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-size: 11px; color: var(--text-muted); font-weight: 600;
      height: 30px; padding: 0 14px; border-bottom: 1px solid var(--border);
    }
    td { height: 38px; padding: 0 14px; border-bottom: 1px solid #16161a; vertical-align: middle; }
    tr:hover td { background: #222227; cursor: pointer; }
    .badge {
      display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 10px;
      font-weight: 600; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary);
    }
    .badge.local { color: var(--green); border-color: #30d15844; background: #30d1581f; }
    footer {
      display: none; height: 76px; background: var(--bg-transport); border-top: 1px solid var(--border);
      align-items: center; justify-content: space-between; padding: 0 18px; gap: 16px;
    }
    svg.icon { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
    @media (max-width: 740px) {
      aside { display: none; }
    }
  </style>
</head>
<body>
  <div id="wasm-container"><canvas id="canvas"></canvas></div>

  <!-- Startup Login Screen -->
  <div id="login-screen">
    <div class="login-panel">
      <div class="login-header">
        <div class="emblem">
          <svg class="icon" style="width:24px;height:24px;color:#fff" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div>
          <div style="font-size:20px;font-weight:700">Sign in to Navidrome</div>
          <div style="font-size:12px;color:var(--text-secondary)">Ultrasonic OpenSubsonic Music Player</div>
        </div>
      </div>
      <div style="height:1px;background:var(--border)"></div>
      <div class="field-group">
        <label class="field-label">SERVER URL</label>
        <input class="text-input" id="srv-url" placeholder="http://localhost:4533" />
      </div>
      <div class="field-group">
        <label class="field-label">USERNAME</label>
        <input class="text-input" id="srv-user" placeholder="Navidrome username" />
      </div>
      <div class="field-group">
        <label class="field-label">PASSWORD</label>
        <input class="text-input" id="srv-pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')connectServer()" />
      </div>
      <button class="btn-primary" onclick="connectServer()">Connect to Navidrome</button>
    </div>
  </div>

  <!-- Main Player Workspace -->
  <div class="workspace" id="webui-app">
    <aside>
      <div class="brand">
        <div class="emblem" style="width:24px;height:24px;border-radius:6px">
          <svg class="icon" style="width:14px;height:14px;color:#fff" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <span>Music</span>
        <span class="dot"></span>
      </div>
      <div>
        <div class="sec-title">LIBRARIES</div>
        <div id="lib-list"></div>
      </div>
      <div>
        <div class="sec-title">LIBRARY</div>
        <button class="nav-btn active" onclick="setFilter('all', this)">Listen Now & Songs</button>
        <button class="nav-btn" onclick="setFilter('starred', this)">Favorites</button>
        <button class="nav-btn" onclick="setFilter('local', this)">Downloaded</button>
      </div>
      <div style="margin-top:auto;border-top:1px solid var(--border);padding-top:12px;font-size:11px;color:var(--text-secondary)">
        <div id="rate-summary">Stream: RAW · Auto-DL: ON</div>
      </div>
    </aside>
    <main>
      <header>
        <div style="display:flex;align-items:center;gap:10px">
          <strong style="font-size:18px">Songs</strong>
          <span class="badge" id="active-lib-pill">All Libraries</span>
        </div>
        <div style="display:flex;gap:8px">
          <button class="pill" onclick="toggleAutoDl()" id="autodl-btn">Auto-Download on Stream: ON</button>
          <button class="pill primary" onclick="refreshState()">Sync</button>
        </div>
      </header>
      <div class="content">
        <table>
          <thead>
            <tr>
              <th style="width:44px;text-align:right">#</th>
              <th>TITLE</th>
              <th>ARTIST</th>
              <th>ALBUM</th>
              <th style="width:110px">FORMAT</th>
              <th style="width:90px">STATUS</th>
              <th style="width:64px;text-align:right">TIME</th>
            </tr>
          </thead>
          <tbody id="track-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <footer id="transport-footer">
    <div style="min-width:240px">
      <div id="np-title" style="font-weight:600;font-size:13px">Not Playing</div>
      <div id="np-artist" style="font-size:11px;color:var(--text-secondary)">Select a song to stream</div>
    </div>
    <audio id="audio-player" controls style="flex:1;max-width:540px;height:34px"></audio>
    <div class="badge" id="np-quality">READY</div>
  </footer>

  <script>
    let state = { connected: false, libraries: [], selected_libraries: [], songs: [], auto_download: true, filter: 'all' };
    async function refreshState() {
      try {
        const res = await fetch('/api/state');
        if (res.ok) {
          state = { ...state, ...(await res.json()) };
          render();
        }
      } catch (_) {}
    }
    async function connectServer() {
      const server_url = document.getElementById('srv-url').value;
      const username = document.getElementById('srv-user').value;
      const password = document.getElementById('srv-pass').value;
      await fetch('/api/connect', {
        method: 'POST',
        body: JSON.stringify({ server_url, username, password }),
      });
      await refreshState();
    }
    async function toggleLib(id) {
      await fetch('/api/toggle-library/' + encodeURIComponent(id), { method: 'POST' });
      await refreshState();
    }
    function setFilter(f, btn) {
      state.filter = f;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }
    function toggleAutoDl() {
      state.auto_download = !state.auto_download;
      fetch('/api/toggle-autodl', { method: 'POST' }).catch(() => {});
      render();
    }
    function playSong(song) {
      document.getElementById('np-title').textContent = song.title;
      document.getElementById('np-artist').textContent = song.artist + ' — ' + song.album;
      document.getElementById('np-quality').textContent = song.quality;
      const player = document.getElementById('audio-player');
      player.src = '/api/stream/' + encodeURIComponent(song.id);
      player.play().catch(() => {});
      setTimeout(refreshState, 1000);
    }
    function render() {
      document.getElementById('login-screen').style.display = state.connected ? 'none' : 'flex';
      document.getElementById('webui-app').style.display = state.connected ? 'flex' : 'none';
      document.getElementById('transport-footer').style.display = state.connected ? 'flex' : 'none';

      if (!state.connected) {
        document.getElementById('srv-url').value = state.server_url || 'http://localhost:4533';
        document.getElementById('srv-user').value = state.username || '';
        return;
      }

      document.getElementById('active-lib-pill').textContent =
        `${state.selected_libraries.length} of ${state.libraries.length} Libraries Active`;

      const libBox = document.getElementById('lib-list');
      libBox.innerHTML = '';
      state.libraries.forEach(lib => {
        const on = state.selected_libraries.length === 0 || state.selected_libraries.includes(lib.id);
        const row = document.createElement('div');
        row.className = 'lib-row';
        row.onclick = () => toggleLib(lib.id);
        row.innerHTML = `<span class="chk ${on ? 'on' : ''}">${on ? '<svg class="icon" style="width:11px;height:11px;color:#fff" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>' : ''}</span><span>${lib.name}</span>`;
        libBox.appendChild(row);
      });
      document.getElementById('autodl-btn').textContent =
        'Auto-Download on Stream: ' + (state.auto_download ? 'ON' : 'OFF');
      document.getElementById('rate-summary').textContent =
        `Stream: ${state.stream_format || 'RAW'} (${state.stream_bitrate || 0}k) · DL: ${state.download_format || 'RAW'}`;

      const tbody = document.getElementById('track-tbody');
      tbody.innerHTML = '';
      state.songs
        .filter(s => state.filter === 'all' || (state.filter === 'starred' && s.starred) || (state.filter === 'local' && s.is_downloaded))
        .forEach((s, i) => {
          const tr = document.createElement('tr');
          tr.onclick = () => playSong(s);
          tr.innerHTML = `
            <td style="text-align:right;color:var(--text-muted)">${i + 1}</td>
            <td style="font-weight:500">${s.title}</td>
            <td style="color:var(--text-secondary)">${s.artist}</td>
            <td style="color:var(--text-secondary)">${s.album}</td>
            <td><span class="badge">${s.quality}</span></td>
            <td>${s.is_downloaded ? '<span class="badge local">LOCAL</span>' : '<span class="badge">STREAM</span>'}</td>
            <td style="text-align:right;color:var(--text-secondary)">${s.duration}</td>`;
          tbody.appendChild(tr);
        });
    }
    refreshState();
  </script>
</body>
</html>
